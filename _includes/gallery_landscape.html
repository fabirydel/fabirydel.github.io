{% assign photo_count = page.images | size %}

<div class="portfolio-gallery">
  <div class="portfolio-grid" data-photo-count="{{ photo_count }}">
    {% assign image_index = 0 %}
    {% for image_path in page.images %}
      <button
        type="button"
        class="photo-tile"
        onclick="openModal({{ image_index }}, 'myLandscapeModal')"
        style="background-image: url('/images/blur/{{ image_path }}');"
        aria-label="{{ page.title }}"
      >
        <img
          class="thumb"
          src="/images/thumb/{{ image_path }}"
          alt="{{ page.title }}"
          loading="lazy"
          decoding="async"
        >
      </button>
      {% assign image_index = image_index | plus: 1 %}
    {% endfor %}
  </div>
</div>
