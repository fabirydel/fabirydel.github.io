{%- comment -%}
  Prev / next bar with a progress label, shared by Explore and Trips.
{%- endcomment -%}
<div class="place-transport is-hidden" id="place-transport">
  <button
    type="button"
    class="ui-icon-btn"
    id="place-prev"
    aria-label="Previous location"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path
        d="M10 3L5 8l5 5"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </svg>
  </button>
  <button
    type="button"
    class="ui-icon-btn"
    id="place-next"
    aria-label="Next location"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path
        d="M6 3l5 5-5 5"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </svg>
  </button>
  <div class="place-transport__meta">
    <span
      class="place-transport__label"
      id="place-stop-label"
    ></span>
    <span class="place-transport__bar"
      ><span id="place-progress"></span
    ></span>
  </div>
</div>
