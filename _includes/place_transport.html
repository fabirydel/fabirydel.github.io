{%- comment -%}
  Prev / next bar with a progress label, shared by Explore and Trips.
  include.center = 'none' leaves out the middle play button.
{%- endcomment -%}
<div class="place-transport is-hidden" id="place-transport">
  <button
    type="button"
    class="ui-icon-btn"
    id="place-prev"
    aria-label="Previous location"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path
        d="M10 3L5 8l5 5"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </svg>
  </button>
  {%- unless include.center == 'none' -%}
  <button
    type="button"
    class="ui-icon-btn ui-icon-btn--play"
    id="place-play"
    aria-label="Play the journey"
    aria-pressed="false"
  >
    <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M4.5 2.5v11l9-5.5z" fill="currentColor" />
    </svg>
    <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M4 2.5h3v11H4zm5 0h3v11H9z" fill="currentColor" />
    </svg>
  </button>
  {%- endunless %}
  <button
    type="button"
    class="ui-icon-btn"
    id="place-next"
    aria-label="Next location"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path
        d="M6 3l5 5-5 5"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </svg>
  </button>
  <div class="place-transport__meta">
    <span
      class="place-transport__label"
      id="place-stop-label"
    ></span>
    <span class="place-transport__bar"
      ><span id="place-progress"></span
    ></span>
  </div>
</div>
