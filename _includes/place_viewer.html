{%- comment -%}
  Full-screen photo viewer shared by Explore and Trips.
{%- endcomment -%}
<div
  class="place-viewer"
  id="place-viewer"
  role="dialog"
  aria-modal="true"
  aria-label="Photo viewer"
  hidden
>
  <img id="place-viewer-img" alt="" />
  <p class="place-viewer__caption" id="place-viewer-caption"></p>
  <button
    type="button"
    class="ui-icon-btn place-viewer__close"
    id="place-viewer-close"
    aria-label="Close"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path
        d="M3.5 3.5l9 9m0-9l-9 9"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        fill="none"
      />
    </svg>
  </button>
  <button
    type="button"
    class="ui-icon-btn place-viewer__nav place-viewer__nav--prev"
    id="place-viewer-prev"
    aria-label="Previous photo"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path
        d="M10 3L5 8l5 5"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </svg>
  </button>
  <button
    type="button"
    class="ui-icon-btn place-viewer__nav place-viewer__nav--next"
    id="place-viewer-next"
    aria-label="Next photo"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path
        d="M6 3l5 5-5 5"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </svg>
  </button>
</div>
