<div id="header">
  <!-- <a class="option-container theme-container theme-small theme-open-seas" href="/nfts">
    <img id="#openseas" class="theme icon open-seas">
    <img id="#openseas" class="theme icon open-seas night">
  </a> -->
  <div
    class="option-container theme-container theme-small"
    onclick="toggleTheme()"
  >
    <span id="#theme" class="theme icon fa-moon"></span>
  </div>
  <div class="header-name">
    <a href="/">
      <h1 class="me">Fabian Rydel</h1>
    </a>
  </div>
  <div class="header-options">
    <div class="left-options">
      <a href="/">
        <h1
          class="portfolio {% if page.url == '/' %} header-selected {% endif %}"
        >
          Portfolio
        </h1>
      </a>

      <a href="/worldmap">
        <h1
          class="locations {% if page.url == '/worldmap.html' %} header-selected {% endif %}"
        >
          Locations
        </h1>
      </a>
    </div>
    <div class="right-options">
      <!-- <a href="/collections">
        <h1 class="collections {% if page.url contains 'collections'  %} header-selected {% endif %}">Collections</h1>
      </a> -->
      <a href="/countries">
        <h1
          class="countries {% if page.url contains 'countries' %} header-selected {% endif %}"
        >
          Countries
        </h1>
      </a>
      {%- unless jekyll.environment == 'production' -%}
        <a href="/upload" class="uw-header-button" id="uw-header-button" style="display:none">
          <h1
            class="upload {% if page.url contains 'upload' %} header-selected {% endif %}"
          >
            Upload
          </h1>
        </a>
        <script>
          // Belt-and-braces: even in dev builds, only show the button when
          // the page is being viewed via localhost (not, say, when the dev
          // build is being previewed over LAN).
          (function () {
            var h = window.location.hostname;
            if (h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0' || h.endsWith('.local')) {
              var el = document.getElementById('uw-header-button');
              if (el) el.style.display = '';
            }
          })();
        </script>
      {%- endunless -%}
      <!-- <a class="option-container theme-container theme-big" href="/nfts">
        <img id="#openseas" class="theme icon open-seas">
        <img id="#openseas" class="theme icon open-seas night">
      </a> -->
      <div
        class="option-container theme-container theme-big"
        onclick="toggleTheme()"
      >
        <span id="#theme" class="theme icon fa-moon"></span>
      </div>
    </div>
  </div>
</div>
