---
layout: portfolio
title: Portfolio
---

<div class="portfolio-gallery">
  <div class="portfolio-grid">
    {% assign image_index = 0 %} {% for image in site.data.portfolio %}
    <button
      type="button"
      class="photo-tile{% if image.large %} photo-tile--large{% endif %}"
      onclick="openModal({{ image_index }}, 'myPortfolioModal')"
      style="background-image: url('/images/blur/{{ image.path }}');"
      aria-label="{{ image.place }}, {{ image.country | capitalize }}"
      data-photo-path="{{ image.path }}"
      data-photo-place="{{ image.place }}"
      data-photo-location="{{ image.location }}"
      data-photo-country="{{ image.country }}"
    >
      <img
        class="thumb"
        src="/images/{% if image.large %}full{% else %}thumb{% endif %}/{{ image.path }}"
        alt="{{ image.place }}, {{ image.country | capitalize }}"
        loading="lazy"
        decoding="async"
      />
      <span class="photo-caption">
        <span class="place">{{ image.place }}</span>
        <span class="country">{{ image.country | capitalize }}</span>
      </span>
    </button>
    {% assign image_index = image_index | plus: 1 %} {% endfor %}
  </div>
</div>
