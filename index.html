---
layout: portfolio
title: Portfolio
---

<div class="portfolio-gallery">
  <div class="portfolio-grid">
    {% assign image_index = 0 %}
    {% for image in site.data.portfolio %}
      <button
        type="button"
        class="photo-tile"
        onclick="openModal({{ image_index }}, 'myPortfolioModal')"
        style="background-image: url('/images/blur/{{ image.path }}');"
        aria-label="{{ image.place }}, {{ image.country | capitalize }}"
      >
        <img
          class="thumb"
          src="/images/thumb/{{ image.path }}"
          alt="{{ image.place }}, {{ image.country | capitalize }}"
          loading="lazy"
          decoding="async"
        >
        <span class="photo-caption">{{ image.place }}, {{ image.country | capitalize }}</span>
      </button>
      {% assign image_index = image_index | plus: 1 %}
    {% endfor %}
  </div>
</div>
